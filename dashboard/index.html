<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miaou — Dashboard</title>
<style>
  :root {
    --bg: #14150f;
    --panel: #1c1e16;
    --panel-2: #23261c;
    --line: #34382a;
    --ink: #e8e6dc;
    --muted: #9b9c8c;
    --accent: #c9a227;
    --done: #6f9e4c;
    --active: #d9a441;
    --todo: #4a4e3c;
    --danger: #b4553f;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 28px 32px 22px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #1b1d14, var(--bg));
  }
  h1 { margin: 0; font-size: 30px; letter-spacing: -0.5px; }
  h1 span { color: var(--accent); }
  .tagline { color: var(--muted); margin-top: 6px; font-size: 14px; }
  .meta { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; }
  .chip {
    background: var(--panel-2); border: 1px solid var(--line);
    padding: 4px 11px; border-radius: 999px; color: var(--muted);
  }
  .chip b { color: var(--ink); font-weight: 600; }
  .overall { margin-top: 14px; height: 6px; background: #191b13;
    border: 1px solid var(--line); border-radius: 4px; overflow: hidden; max-width: 520px; }
  .overall i { display: block; height: 100%; background: var(--done);
    transition: width .7s cubic-bezier(.2,.8,.2,1); }
  main { padding: 26px 32px 60px; max-width: 1400px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 1.2px;
       color: var(--muted); margin: 30px 0 14px; font-weight: 600; }
  h2:first-child { margin-top: 0; }

  /* Gantt */
  .gantt { border: 1px solid var(--line); border-radius: var(--radius);
           overflow-x: auto; background: var(--panel); }
  .gantt table { border-collapse: collapse; width: 100%; min-width: 720px; }
  .gantt th { font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
              color: var(--muted); text-align: left; padding: 11px 14px;
              border-bottom: 1px solid var(--line); font-weight: 600; }
  .gantt td { padding: 9px 14px; border-bottom: 1px solid #262920; vertical-align: middle; }
  .gantt tr:last-child td { border-bottom: 0; }
  .gantt .sname { font-weight: 600; white-space: nowrap; }
  .gantt .sid { color: var(--accent); font-variant-numeric: tabular-nums;
                margin-right: 8px; font-weight: 700; }
  .track { position: relative; height: 22px; background: #191b13;
           border-radius: 5px; min-width: 340px; }
  .bar { position: absolute; top: 3px; height: 16px; border-radius: 4px;
         display: flex; align-items: center; padding: 0 8px;
         font-size: 11px; font-weight: 700; white-space: nowrap; }
  .bar.done   { background: var(--done); }
  .bar.active { background: var(--active); }
  .bar.planned{ background: var(--todo); }
  .bar-pct { font-size: 11px; font-weight: 700; white-space: nowrap; }
  .bar-pct.inside  { color: #14150f; }
  .bar-pct.outside { position: absolute; top: 4px; color: var(--active); }
  .today { position: absolute; top: -3px; bottom: -3px; width: 2px;
           background: var(--danger); }

  /* Sprint cards */
  .cards { display: grid; gap: 16px;
           grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 18px; }
  .card.is-active { border-color: var(--accent); }
  .card h3 { margin: 0 0 3px; font-size: 17px; }
  .card h3 em { color: var(--accent); font-style: normal; margin-right: 7px; }
  .card .goal { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .prog { height: 5px; background: #191b13; border-radius: 3px;
          overflow: hidden; margin-bottom: 14px; }
  .prog i { display: block; height: 100%; background: var(--done); }
  ul.items { list-style: none; margin: 0; padding: 0; }
  ul.items li { display: flex; gap: 9px; padding: 5px 0; font-size: 13.5px;
                align-items: flex-start; }
  .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px;
         flex: 0 0 9px; background: var(--todo); }
  .dot.done { background: var(--done); }
  .dot.active { background: var(--active); }
  .it-note { color: var(--muted); font-size: 12px; }
  .strike { color: var(--muted); }

  .empty { color: var(--muted); font-style: italic; }
  footer { padding: 24px 32px; border-top: 1px solid var(--line);
           color: var(--muted); font-size: 12.5px; }
  footer a { color: var(--accent); }
  code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px;
         font-size: 12px; }
  @media (max-width: 640px) {
    header, main, footer { padding-left: 18px; padding-right: 18px; }
  }
</style>
</head>
<body>
<header>
  <h1>Miao<span>u</span></h1>
  <div class="tagline" id="tagline">Loading…</div>
  <div class="meta" id="meta"></div>
  <div class="overall"><i id="overall-fill" style="width:0%"></i></div>
</header>

<main>
  <section id="view-sprints">
    <h2>Timeline</h2>
    <div class="gantt" id="gantt"></div>
    <h2>Sprints</h2>
    <div class="cards" id="cards"></div>
  </section>
</main>

<footer>
  Generated from <code>dashboard/roadmap.json</code>.
  &nbsp;·&nbsp; <a href="https://github.com/benoitbac/MyLovelyWebCat">Repository</a>
</footer>

<script src="app.js"></script>
</body>
</html>
