<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>NekoGPU — compagnon félin WebGPU</title>
  <meta name="description" content="Un compagnon virtuel félin de bureau, 100% WebGPU, sans aucune dépendance." />
  <link rel="icon" href="assets/cat.svg" />
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <canvas id="gpu"></canvas>

  <!-- Panneau de personnalisation "ADN Cosmétique" -->
  <aside id="panel">
    <header>
      <h1>Neko<span>GPU</span></h1>
      <button id="panel-toggle" title="Réduire (H)" aria-label="Réduire le panneau">⟨⟩</button>
    </header>

    <div class="body">
      <div class="grid">
        <label>Pelage<input type="color" id="c-primary" value="#7b5cff" /></label>
        <label>Néon<input type="color" id="c-neon" value="#00e5ff" /></label>
        <label>Yeux<input type="color" id="c-accent" value="#39ff14" /></label>
      </div>

      <label class="row">Comportement
        <select id="c-behavior">
          <option value="magnet">🧲 Aimant (suit la souris)</option>
          <option value="shy">🙈 Timide (fuit la souris)</option>
        </select>
      </label>

      <label class="row">Densité
        <select id="c-density">
          <option value="low">Basse · 22k</option>
          <option value="medium">Moyenne · 48k</option>
          <option value="high">Haute · 90k</option>
        </select>
      </label>

      <label class="slider">Traînée <span class="hint">✧</span>
        <input type="range" id="c-trail" min="0" max="1" step="0.01" value="0.55" />
      </label>
      <label class="slider">Lueur <span class="hint">✦</span>
        <input type="range" id="c-glow" min="0" max="1" step="0.01" value="0.85" />
      </label>

      <label class="check"><input type="checkbox" id="c-hat" /> Chapeau cyberpunk 🎩</label>

      <div class="actions">
        <button id="btn-random" class="ghost">🎲 Aléatoire</button>
        <button id="btn-reset" class="ghost">↺ Reset</button>
      </div>
      <div class="actions">
        <button id="btn-link" class="primary">🔗 Lien de partage</button>
        <button id="btn-card" class="primary">🖼️ Ma carte</button>
      </div>

      <footer>
        <span><b id="stat-fps">–</b> FPS</span>
        <span><b id="stat-count">–</b> particules</span>
      </footer>
      <p class="tip">Bouge la souris pour jouer avec lui · clique pour le caresser · <kbd>R</kbd> aléatoire · <kbd>H</kbd> panneau</p>
    </div>
  </aside>

  <div id="toast"></div>

  <div id="loading">Initialisation WebGPU…</div>

  <div id="overlay">
    <div class="overlay-card">
      <img src="assets/cat.svg" alt="" width="120" />
      <h2>Oups…</h2>
      <p class="overlay-msg"></p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
