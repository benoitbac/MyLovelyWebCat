<svg width="420" height="360" viewBox="0 0 420 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A lovely 3D-style cat">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#2b2f52"/>
      <stop offset="100%" stop-color="#12142b"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b7bf5"/>
      <stop offset="100%" stop-color="#5b4bd6"/>
    </linearGradient>
    <linearGradient id="furDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f5fe0"/>
      <stop offset="100%" stop-color="#4636b8"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efeaff"/>
      <stop offset="100%" stop-color="#cabffa"/>
    </linearGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8fb1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff8fb1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="420" height="360" rx="24" fill="url(#bg)"/>
  <ellipse cx="210" cy="312" rx="120" ry="20" fill="#000" opacity="0.25"/>

  <!-- tail -->
  <path d="M300 250 q70 10 60 -60 q-6 -40 -34 -30 q22 8 16 40 q-8 34 -46 26 z" fill="url(#furDark)"/>

  <!-- body -->
  <path d="M120 300 q-18 -110 90 -110 q108 0 90 110 z" fill="url(#fur)"/>
  <path d="M162 300 q-8 -70 48 -70 q56 0 48 70 z" fill="url(#belly)"/>

  <!-- head -->
  <g>
    <!-- ears -->
    <path d="M138 132 l-6 -58 l58 30 z" fill="url(#furDark)"/>
    <path d="M282 132 l6 -58 l-58 30 z" fill="url(#furDark)"/>
    <path d="M150 118 l-3 -34 l33 18 z" fill="#ff8fb1"/>
    <path d="M270 118 l3 -34 l-33 18 z" fill="#ff8fb1"/>

    <!-- face -->
    <ellipse cx="210" cy="158" rx="90" ry="82" fill="url(#fur)"/>

    <!-- cheeks -->
    <circle cx="158" cy="182" r="26" fill="url(#cheek)"/>
    <circle cx="262" cy="182" r="26" fill="url(#cheek)"/>

    <!-- eyes -->
    <g>
      <ellipse cx="176" cy="156" rx="17" ry="21" fill="#1a1030"/>
      <ellipse cx="244" cy="156" rx="17" ry="21" fill="#1a1030"/>
      <circle cx="182" cy="149" r="6" fill="#fff"/>
      <circle cx="250" cy="149" r="6" fill="#fff"/>
      <circle cx="172" cy="162" r="2.5" fill="#fff" opacity="0.8"/>
      <circle cx="240" cy="162" r="2.5" fill="#fff" opacity="0.8"/>
    </g>

    <!-- nose + mouth -->
    <path d="M204 178 h12 l-6 8 z" fill="#ff8fb1"/>
    <path d="M210 186 q-8 12 -20 6 M210 186 q8 12 20 6" stroke="#3a2a6a" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#soft)"/>

    <!-- whiskers -->
    <g stroke="#d9d2ff" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
      <path d="M120 168 h-40 M122 182 h-42 M128 196 h-38"/>
      <path d="M300 168 h40 M298 182 h42 M292 196 h38"/>
    </g>
  </g>

  <!-- paws -->
  <ellipse cx="176" cy="300" rx="26" ry="16" fill="url(#belly)"/>
  <ellipse cx="244" cy="300" rx="26" ry="16" fill="url(#belly)"/>
</svg>
